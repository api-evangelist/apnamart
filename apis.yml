name: ApnaMart
description: >-
  ApnaMart (Apna Mart) is a Bengaluru-based Indian retail and quick-commerce company
  founded in 2022 by Chetan Kumar Garg and Abhishek Singh. It operates a network of
  franchise-model neighborhood grocery and FMCG stores combined with a 15-minute
  delivery app, serving customers across roughly 14 cities including tier-2 and tier-3
  markets such as Ranchi, Hazaribagh, and Bilaspur. Backed by Accel, Peak XV, and
  Fundamentum, the company blends brick-and-mortar retail with on-demand delivery of
  daily essentials. ApnaMart is a consumer retail business and does not publish a public
  developer platform or API surface; this profile in the API Evangelist network captures
  its identity, domain-security posture, and published web properties.
